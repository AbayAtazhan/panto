name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please attach the diagnostics log — it makes the difference
        between a guess and a fix: `tail -40 ~/Library/Logs/Panto.log`

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1 (25B78)"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac
      placeholder: "MacBook Pro 14, M4 Pro"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Panto?
      options:
        - Release DMG
        - Built from source
        - Homebrew
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Panto
        2. Press Record
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Diagnostics log
      description: "`tail -40 ~/Library/Logs/Panto.log`"
      render: shell
